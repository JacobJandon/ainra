name: Conformance / vector discrepancy
description: Your implementation disagrees with a published CC0 conformance vector, or two AINRA impls disagree.
labels: ["conformance"]
body:
  - type: markdown
    attributes:
      value: |
        AINRA's correctness is defined by the **public CC0 conformance vectors** (`vectors/`) and the requirement that
        three independent implementations (core, sdk-ts, P0) agree on every one (`make diff`). "My verifier disagrees
        with a vector" is a **first-class report** — it means either your implementation, or ours, or the vector is
        wrong. Thank you for pinning it down.
  - type: input
    id: vector
    attributes:
      label: Which vector
      description: The vector file (and case) where the disagreement occurs.
      placeholder: e.g. vectors/v1/valid-chain-0025.json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 6bf0457 / v0.1.0
    validations:
      required: true
  - type: textarea
    id: disagreement
    attributes:
      label: Expected vs observed verdict
      description: The vector's `expect` verdict (+ reason) and what your implementation produced.
      placeholder: |
        vector expects: invalid:revoked
        my verifier says: valid
    validations:
      required: true
  - type: dropdown
    id: which-impl
    attributes:
      label: Which implementation is yours?
      options:
        - A third-party / my own implementation
        - ainra-core (Rust)
        - "@ainra/sdk (TypeScript)"
        - apps/cli-node (P0)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: How you verified
      description: The command / snippet, so we can reproduce. If `make diff` reproduces it, say so.
    validations:
      required: false
