# SPDX-License-Identifier: Apache-2.0 OR MIT
# AINRA CI — hard gates (MTS §28). Mirrors `make preflight` / `make ci`. Runs on push + PR (fast feedback) and nightly
# (catches environment drift with no commits). Jobs run in parallel; the fast ones (fmt/clippy/test) report in minutes
# while the heavier repro/integration jobs run alongside — see D-026 for the reproducibility-in-CI decision.
name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *" # nightly full run (07:00 UTC) — durability against upstream/toolchain drift

# Newer pushes to the same ref supersede in-flight runs (faster feedback, fewer wasted minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: fmt · clippy · test · vectors-replay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96 # pinned; matches rust-toolchain.toml (channel = "1.96")
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # --release is REQUIRED (this is `make test`): a debug build stack-overflows the crypto-heavy
      # `registrar::tests::issue_then_verify_valid` (large unoptimized ML-DSA/SLH-DSA stack frames), which is NOT a
      # bug — the optimized release frames fit the default thread stack. Never switch this to a debug build.
      - run: cargo test --release --workspace --all-features
      # Replay the committed CC0 corpora (fast, no regeneration) — the generator holding itself honest.
      - run: cargo run --release -q -p ainra-vector-gen -- --check vectors/v1 --min 500
      - run: cargo run --release -q -p ainra-vector-gen -- --check-delta vectors/v1-delta
      - run: cargo run --release -q -p ainra-vector-gen -- --check-directory vectors/v1-directory

  differential:
    name: 3-way differential (core · sdk-ts · P0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd packages/sdk-ts && npm ci && npm run build
      # Regenerate BOTH corpora deterministically so a drift between code and committed vectors is caught, then diff.
      - run: cargo run --release -q -p ainra-vector-gen -- --out vectors/v1 --min 500
      - run: cargo run --release -q -p ainra-vector-gen -- --delta-out vectors/v1-delta
      - run: cargo run --release -q -p ainra-vector-gen -- --directory-out vectors/v1-directory
      - run: git diff --exit-code -- vectors/v1 vectors/v1-delta vectors/v1-directory || (echo "committed vectors differ from regenerated (nondeterminism?)" && exit 1)
      - run: node tools/diff-harness/run.mjs
      # The downloadable CLI meets the same hybrid bar: Ed25519 + ML-DSA-65 both-or-invalid, legacy(alg_downgrade,
      # overlap-only) vs tampered(sig_invalid, always closed). Runs the shipped source; @noble via the SDK install.
      - run: node tools/cli-hybrid-check.mjs
      # Suite Migration Drill 01: a real Ed25519 -> hybrid migration over a running network (REISSUE + prev_leaf,
      # auto-expiring policy epoch, legacy-fails/hybrid-passes). The staging audit skips cleanly when staging is down.
      - run: node tools/suite-migration-drill.mjs --quiet

  wedge:
    name: verifier wedge (@ainra/middleware fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Build the SDK, install + build the middleware (file: dep on the SDK), run the fail-closed gate tests.
      - run: cd packages/sdk-ts && npm ci && npm run build
      - run: cd packages/middleware && npm install && npm run build && npm test

  # The publish gate a contributor cannot regress: `make audit` = S7 (fixtures + prose + EVERY commit message) +
  # license headers + gitleaks over full history. Needs the whole history for the commit-message scan + gitleaks.
  audit:
    name: publish audit (make audit — S7 · license · gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # S7 scans all commit messages; gitleaks scans all commits
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install gitleaks
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - run: make audit

  hygiene:
    name: freeze · no-network · npm-audit · status-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: README/STATUS/DOD agree (docs-vs-reality lockstep)
        run: node tools/status-consistency.mjs
      - name: Docs freeze (normative docs unchanged — M7)
        run: make check-freeze
      - name: ainra-core has no network / IO / clock (N7)
        run: |
          if grep -rnE "std::net|std::fs|reqwest|hyper|ureq|tokio|std::process|SystemTime|Instant|std::env" crates/ainra-core/src/; then
            echo "ainra-core must be a pure library (N7) — network/IO/clock reference found"; exit 1
          fi
          echo "ainra-core clean: no net/fs/clock/env"
      - name: SDK dependency audit
        run: cd packages/sdk-ts && npm ci && npm audit --audit-level=high

  fuzz-smoke:
    name: fuzz smoke (parsers never panic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: ./tools/fuzz-smoke.sh

  integration:
    name: end-to-end (drill · testbed · genesis-local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # M6 witness quorum catches an injected fork; M5 wedge accepts VALID + rejects revoked/forged; M8 whole stack
      # (dual root → 2 distinct registrar classes → verify root-dark → revoke/forge fail closed → fork caught).
      - run: make drill
      - run: make testbed
      - run: make genesis-local

  reproducibility:
    name: reproducible builds + mirror byte-verify (M7)
    runs-on: ubuntu-latest
    # ~6 min locally; kept on PR (in its own parallel job, so it never blocks fast feedback) so a reproducibility
    # regression is caught BEFORE merge, not only nightly. Generous timeout guards against a hang. See D-026.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Rebuild the 729-file spec artifact set from source into a fresh temp tree twice; assert committed == rebuild.
      - run: make repro
      # A mirror must byte-verify; a tampered mirror must FAIL closed (regression for the M7 review).
      - run: make mirror OUT=build/ci-mirror
      - run: make verify-mirror MIRROR=build/ci-mirror
      - name: verify-mirror fails closed on tamper
        run: |
          printf 'x' >> build/ci-mirror/vectors/v1-directory/directory-valid-2.json
          if make verify-mirror MIRROR=build/ci-mirror; then
            echo "verify-mirror accepted a TAMPERED mirror — fail-closed broken"; exit 1
          fi
          echo "verify-mirror correctly rejected the tampered mirror"
