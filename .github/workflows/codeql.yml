# CodeQL — free for public repos, and Rust is supported (build-mode: none). This complements, and does
# not replace, the differential + conformance corpus: static analysis finds a different class of defect
# than four implementations agreeing on the corpus.
name: codeql
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "41 4 * * 2" }]
permissions: { contents: read }
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: rust, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
          - { language: python, build-mode: none }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with: { category: "/language:${{ matrix.language }}" }
