# SPDX-License-Identifier: Apache-2.0 OR MIT
# Publish the static site (site/) to GitHub Pages. INERT until the human enables Pages (repo Settings → Pages →
# Source: "GitHub Actions") — see docs/PUBLISH-AUDIT.md. Runs `make site` to refresh the derived downloads, then
# deploys the site/ directory. No secrets; no external calls beyond installing `zip`.
name: Deploy site (GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/cli-node/**"
      - "docs/AINRA_I_The_Standard.md"
      - "tools/site.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - name: Build the site (refresh derived downloads from canonical sources)
        run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
