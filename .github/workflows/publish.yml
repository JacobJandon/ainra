# Publishing with provenance, wired in the SAME pass as the publish itself.
#
# Provenance CANNOT be retrofitted onto a version that is already public — a package published without an
# attestation stays that way forever. So this workflow is the only publish path: it uses trusted publishing
# (short-lived OIDC credentials minted per run) on every registry that offers it, and no long-lived token is
# stored anywhere. Triggered by hand, per registry, so the maintainer keeps the button.
#
# BEFORE THE FIRST RUN, one-time setup the maintainer performs (each binds to an exact owner/repo + workflow):
#   npm       npmjs.com → package/org settings → Trusted Publisher → this repository + .github/workflows/publish.yml
#   PyPI      pypi.org → publishing → Add a new pending publisher → same repo + workflow + environment: pypi
#   crates.io the FIRST version must be published manually; afterwards link the repo and (recommended) enable
#             owner-enforced trusted publishing so token auth is disabled entirely.
# Re-point all three if the repository ever moves (docs/ORG-MOVE.md).
name: publish
on:
  workflow_dispatch:
    inputs:
      target:
        description: which registry to publish to
        required: true
        type: choice
        options: [npm-sdk, npm-middleware, pypi, dry-run]
permissions: {}          # least privilege: every job re-declares only what it needs

jobs:
  preflight:
    name: preflight — nothing publishes over a red board
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      # fetch-depth: 0 is LOAD-BEARING, not a habit. checkout@v4 clones shallow and WITHOUT tags, so the D-040 gate
      # ("never publish from untagged source") looked at a tagless checkout and reported "no tag v0.3.0" — while
      # v0.3.0 exists here and on the remote. A safety gate firing for the wrong reason is the worst kind of green:
      # the day it stops firing, you would believe you were protected when you were not.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      # The script builds the sdk and the wheel to inspect what would actually ship. A bare runner has neither the
      # TypeScript types nor the Python build backend, so both steps failed as BLOCKERs that said nothing about the
      # release. Provision them here rather than teaching the gate to shrug.
      - name: Provision what the preflight inspects
        run: |
          npm --prefix packages/sdk-ts install --no-audit --no-fund
          python3 -m pip install --quiet build twine
      - name: publish-preflight (publishes nothing, holds no credentials)
        run: PREFLIGHT_OFFLINE=1 bash tools/publish-preflight.sh

  npm:
    name: npm — trusted publishing + provenance
    needs: preflight
    if: startsWith(inputs.target, 'npm-')
    runs-on: ubuntu-latest          # provenance requires a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write               # mints the OIDC token that IS the credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'        # ships an npm new enough for trusted publishing — no self-upgrade needed
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@latest && npm --version
      - name: build the SDK (both packages ship dist/)
        run: cd packages/sdk-ts && npm install --no-audit --no-fund && npm run build
      - name: point middleware at the published SDK, not the local path
        if: inputs.target == 'npm-middleware'
        run: |
          # npm does NOT rewrite file: on publish — a published file: dep installs a dangling symlink.
          npm --prefix packages/middleware pkg set dependencies.@ainra/sdk="^$(node -p "require('./packages/sdk-ts/package.json').version")"
          cd packages/middleware && npm install --no-audit --no-fund && npm run build
      - name: publish
        run: |
          case "${{ inputs.target }}" in
            npm-sdk)        cd packages/sdk-ts ;;
            npm-middleware) cd packages/middleware ;;
          esac
          npm publish --access public --provenance
      - name: confirm the attestation is on the registry
        run: |
          P=$([ "${{ inputs.target }}" = "npm-sdk" ] && echo @ainra/sdk || echo @ainra/middleware)
          sleep 20
          npm view "$P" version
          # fail the run if the published version carries no attestation
          npm audit signatures --registry=https://registry.npmjs.org || true
          curl -sf "https://registry.npmjs.org/-/npm/v1/attestations/$P@$(npm view "$P" version)" >/dev/null \
            && echo "attestation present ✓" || { echo "::error::published WITHOUT an attestation"; exit 1; }

  pypi:
    name: PyPI — trusted publishing + PEP 740 attestations
    needs: preflight
    if: inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi               # the publisher binds to this environment name
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade build && python -m build packages/sdk-py
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/sdk-py/dist
          attestations: true        # PEP 740 — the provenance that cannot be added later

  dry-run:
    name: dry run — prove the path without publishing
    needs: preflight
    if: inputs.target == 'dry-run'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24', registry-url: https://registry.npmjs.org }
      # Do NOT self-upgrade npm here. `npm install -g npm@latest` replaces npm's own global install while it
      # is running and dies half-way with MODULE_NOT_FOUND (it deleted the dependency it was about to use).
      # Node 24 already ships an npm new enough for trusted publishing, so ASSERT the capability instead of
      # mutating the toolchain — if a runner image ever regresses, this says so plainly rather than
      # publishing without provenance.
      - name: npm must be new enough for trusted publishing
        run: |
          need=11.5.1; have=$(npm --version)
          printf 'npm %s (need >= %s)\n' "$have" "$need"
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] || {
            echo "npm $have is too old for trusted publishing — provenance would be silently skipped"; exit 1; }
      - run: cd packages/sdk-ts && npm install --no-audit --no-fund && npm run build && npm publish --dry-run --provenance --access public
