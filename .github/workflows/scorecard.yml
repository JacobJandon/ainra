# OpenSSF Scorecard — 23 automated supply-chain checks, free for public repos, no entity required.
# A project whose entire pitch is "don't trust us, verify us" should publish a third-party-legible
# score rather than asking anyone to take our word for the same properties.
name: scorecard
on:
  branch_protection_rule:
  schedule: [{ cron: "27 5 * * 1" }]
  push: { branches: [main] }
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result to the security tab
      id-token: write          # publish the result so the badge can resolve it
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { persist-credentials: false }
      # `@v2` was never a tag on this action — the workflow had never resolved, so it failed at
      # "Unable to resolve action" on every push and the score was never actually published.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with: { sarif_file: results.sarif }
