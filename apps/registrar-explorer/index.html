<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 OR MIT -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AINRA — registrar explorer</title>
<style>
:root{
  --green:#1A6B4E;--green-br:#2E8B60;--green-l:#EAF4EE;--ink:#0B1220;--ink2:#111B30;
  --paper:#F5F6F3;--card:#FFFFFF;--line:#E2E5DF;--line2:#EDEFEA;--muted:#5A6372;--cool:#8A93A3;
  --red:#B23A3A;--red-l:#FBECEC;--amber:#8A6D1F;
  --mono:'SFMono-Regular',ui-monospace,'DejaVu Sans Mono',Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
a{color:var(--green)}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

/* layout */
.app{display:flex;flex-direction:column;height:100vh}
header.top{background:var(--ink);color:#E7EAF0;padding:14px 22px;display:flex;align-items:center;gap:16px;flex:none}
header.top .sig{width:30px;height:30px;flex:none}
header.top h1{font-size:15px;font-weight:700;letter-spacing:.02em;margin:0}
header.top .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--cool);text-transform:uppercase}
header.top .stats{margin-left:auto;display:flex;gap:20px;font-family:var(--mono);font-size:11px}
header.top .stats b{display:block;font-size:17px;color:#E7EAF0;font-weight:700}
header.top .stats span{color:var(--cool);letter-spacing:.08em;font-size:9.5px;text-transform:uppercase}

.toolbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;flex:none}
.search{position:relative;flex:1;min-width:240px}
.search input{width:100%;font-family:var(--mono);font-size:13px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.search input:focus{outline:none;border-color:var(--green);background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
.selects{display:flex;gap:8px;flex-wrap:wrap}
select{font-family:var(--mono);font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
select:focus{outline:none;border-color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:6px 11px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--muted);transition:.12s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.rev[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.chip.del[aria-pressed="true"]{background:var(--green);border-color:var(--green)}

.body{flex:1;display:flex;min-height:0}
.list{flex:1;overflow:auto;padding:0}
.list .meta{padding:9px 22px;font-family:var(--mono);font-size:11px;color:var(--muted);border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--paper);z-index:1}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cool);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:33px;background:var(--paper);cursor:pointer;user-select:none;white-space:nowrap}
thead th .ar{opacity:.4;margin-left:3px}
thead th[aria-sort] .ar{opacity:1;color:var(--green)}
tbody tr{border-bottom:1px solid var(--line2);cursor:pointer}
tbody tr:hover{background:var(--green-l)}
tbody tr[aria-selected="true"]{background:var(--green-l);box-shadow:inset 3px 0 0 var(--green)}
tbody td{padding:10px 14px;vertical-align:middle}
td.sub{font-family:var(--mono);font-size:12.5px}
td.sub .op{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:3px 8px;border-radius:5px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--green-l);color:var(--green)}
.badge.bad{background:var(--red-l);color:var(--red)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tier{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.hops{font-family:var(--mono);font-size:11px;color:var(--green);font-weight:600}
.hops.zero{color:var(--cool);font-weight:400}
.empty{padding:60px 22px;text-align:center;color:var(--muted)}

/* detail */
.detail{width:0;flex:none;background:var(--card);border-left:1px solid var(--line);overflow:auto;transition:width .18s ease}
.detail.open{width:min(50%,620px)}
.detail-inner{padding:22px 24px 60px;width:min(50%,620px)}
.dh{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.dh h2{font-family:var(--mono);font-size:14px;margin:0;word-break:break-all;flex:1;line-height:1.4}
.dh .x{border:none;background:var(--paper);border-radius:6px;width:28px;height:28px;font-size:16px;color:var(--muted);flex:none}
.dh .x:hover{background:var(--line)}
.verdict-banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:9px;margin:12px 0 18px;font-weight:700}
.verdict-banner.ok{background:var(--green-l);color:var(--green)}
.verdict-banner.bad{background:var(--red-l);color:var(--red)}
.verdict-banner .big{font-family:var(--mono);font-size:16px;letter-spacing:.04em}
.sec{margin:18px 0}
.sec h3{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cool);margin:0 0 8px;font-weight:700}
.kv{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;font-size:13px}
.kv dt{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-all}
.caps{display:flex;flex-wrap:wrap;gap:5px}
.cap{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:3px 7px}
.cap.ceil{border-style:dashed;color:var(--muted)}
/* chain */
.chain{display:flex;flex-direction:column;gap:0}
.hop{display:flex;gap:10px;align-items:flex-start;position:relative;padding:0 0 14px 0}
.hop .node{width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--card);box-shadow:0 0 0 1px var(--green);margin-top:3px;flex:none;z-index:1}
.hop:not(:last-child)::before{content:"";position:absolute;left:5px;top:12px;bottom:0;width:1.5px;background:var(--line)}
.hop .hc{flex:1}
.hop .who{font-family:var(--mono);font-size:12px;word-break:break-all}
.hop .grant{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
/* trace */
.trace{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.step{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line2);font-size:12.5px}
.step:last-child{border-bottom:none}
.step .ic{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.step .ic.ok{background:var(--green)}
.step .ic.bad{background:var(--red)}
.step .ic.skip{background:var(--cool)}
.step .lbl{flex:1}
.step .lbl b{font-weight:600}
.step .lbl small{display:block;color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:1px}
.step .src{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--cool);border:1px solid var(--line);border-radius:4px;padding:2px 5px;flex:none}
.step .src.core{color:var(--green);border-color:var(--green)}
/* actions */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{font-family:var(--mono);font-size:12px;font-weight:600;padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.danger:hover{background:#9e3030}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nowctl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.nowctl input{font-family:var(--mono);font-size:11px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:120px}
.note{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;padding:11px 18px;border-radius:9px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);opacity:0;transition:.2s;pointer-events:none;z-index:10}
.toast.show{opacity:1}
.daemon{font-family:var(--mono);font-size:10.5px;color:var(--cool);display:flex;align-items:center;gap:6px}
.daemon input{font-family:var(--mono);font-size:10.5px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;width:150px;background:var(--card)}
.daemon .live{width:7px;height:7px;border-radius:50%;background:var(--cool)}
.daemon .live.on{background:var(--green)}
@media(max-width:820px){.detail.open{width:100%;position:absolute;right:0;top:0;bottom:0;z-index:5}.detail-inner{width:100%}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="sig" aria-hidden="true"><svg viewBox="0 0 112 112">
      <path d="M 98.4 33.5 A 48 48 0 1 0 78.5 13.6" fill="none" stroke="#E7EAF0" stroke-width="4" stroke-linecap="round"/>
      <path d="M 80.6 11.5 L 83.4 18.5 L 76.4 15.7 Z" fill="#E7EAF0"/>
      <circle cx="56" cy="56" r="34" stroke="#E7EAF0" stroke-width="1.4" fill="none"/>
      <ellipse cx="56" cy="56" rx="11" ry="34" stroke="#E7EAF0" stroke-width="1" fill="none"/>
      <line x1="22" y1="56" x2="90" y2="56" stroke="#E7EAF0" stroke-width="1.1"/>
      <path d="M56 22 a34 34 0 0 1 34 34" stroke="#57C08F" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="56" cy="56" r="2.6" fill="#E7EAF0"/>
    </svg></span>
    <div>
      <h1>AINRA Registrar Explorer</h1>
      <div class="sub">Agent identity &amp; naming registry authority</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="q" type="text" placeholder="Search subject, operator, lineage, capability…  (press /)" autocomplete="off" spellcheck="false">
    </div>
    <div class="selects">
      <select id="fRegistrar"><option value="">All registrars</option></select>
      <select id="fTier"><option value="">All tiers</option></select>
      <select id="fAuth"><option value="">All auth classes</option></select>
    </div>
    <div class="chips">
      <button class="chip" id="cValid" aria-pressed="false">valid</button>
      <button class="chip rev" id="cRevoked" aria-pressed="false">revoked</button>
      <button class="chip del" id="cDelegated" aria-pressed="false">delegated</button>
    </div>
    <div class="daemon" title="Live registrar-box daemon for genuine revoke + re-verify">
      <span class="live" id="daemonLive"></span>
      <input id="daemonUrl" type="text" placeholder="daemon url (optional)" spellcheck="false">
    </div>
  </div>

  <div class="body">
    <div class="list">
      <div class="meta" id="listMeta">loading…</div>
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No credentials match these filters.</div>
    </div>
    <aside class="detail" id="detail"><div class="detail-inner" id="detailInner"></div></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ── state ───────────────────────────────────────────────────────────────────────────────────────────────────────
const S = {
  registry:null, records:[], window:null,
  q:"", fRegistrar:"", fTier:"", fAuth:"",
  valid:false, revoked:false, delegated:false,
  sort:{key:"sub",dir:1}, selected:null,
  now:0, daemon:"", daemonOk:false,
};
const COLS = [
  {key:"sub",  label:"Subject"},
  {key:"registrar", label:"Registrar"},
  {key:"tier", label:"Tier"},
  {key:"auth", label:"Auth"},
  {key:"hops", label:"Chain"},
  {key:"status", label:"Status"},
  {key:"verdict", label:"Verdict"},
];
const REASONS = {
  sig_invalid:"a required signature failed to verify",
  alg_downgrade:"a mandated hybrid signature (Ed25519 or ML-DSA-65) was absent",
  expired:"the validity window has ended", not_yet_valid:"not yet valid (nbf in the future)",
  revoked:"revoked in the registrar's status list", mandate_revoked:"a mandate in the subtree is revoked",
  chain_widening:"a delegation hop granted more than its parent", chain_expired:"a hop outlived its parent",
  not_logged:"no Merkle inclusion proof to a signed checkpoint", checkpoint_invalid:"the checkpoint signature did not verify",
  stale_status:"status material older than the freshness class allows", name_malformed:"a name violated the namespace grammar",
  ceiling_exceeded:"a capability exceeds the scope ceiling", unknown_registrar:"issuer not in the signed directory",
  schema_violation:"the passport violated the schema (missing MUST / forbidden field)",
};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ── load ────────────────────────────────────────────────────────────────────────────────────────────────────────
async function load(){
  let reg;
  try{
    const r = await fetch("data/registry.json",{cache:"no-store"});
    if(!r.ok) throw 0; reg = await r.json();
  }catch(e){
    try{ const r2 = await fetch("registry.json",{cache:"no-store"}); reg = await r2.json(); }
    catch(e2){ document.getElementById("listMeta").textContent =
      "Could not load registry.json — run `make explorer` (or `ainra seed apps/registrar-explorer/data`) and serve this directory."; return; }
  }
  S.registry = reg;
  S.window = reg.generated_window;
  S.now = reg.generated_window ? reg.generated_window.verified_at : 0;
  // flatten
  S.records = [];
  for(const R of reg.registrars){
    for(const e of R.records){
      const rec = e.record;
      S.records.push({
        ...rec,
        registrar: rec.registrar || R.registrar,
        accreditation: R.accreditation, rootPub: R.root_pub_slh, statusList: R.status_list,
        statusSeq: R.status_seq, shipped: e.verdict,
        localRevoked: rec.revoked,        // mutable status for the revoke workflow
        hopN: (rec.hops||[]).length,
      });
    }
  }
  buildFilters(reg);
  restoreFromHash();
  render();
}

function buildFilters(reg){
  const regs=[...new Set(S.records.map(r=>r.registrar))].sort();
  const tiers=[...new Set(S.records.map(r=>r.tier))].sort();
  const auths=[...new Set(S.records.map(r=>r.auth_class))].sort();
  fill("fRegistrar",regs); fill("fTier",tiers); fill("fAuth",auths);
  const t=S.registry.totals||{};
  document.getElementById("stats").innerHTML =
    stat(t.registrars,"registrars")+stat(t.issued,"issued")+stat(t.delegated,"delegated")+stat(t.revoked,"revoked");
  // header cols
  document.getElementById("head").innerHTML = COLS.map(c=>`<th data-key="${c.key}">${c.label}<span class="ar"></span></th>`).join("");
  document.querySelectorAll("#head th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.key;
    S.sort = S.sort.key===k ? {key:k,dir:-S.sort.dir} : {key:k,dir:1};
    render();
  });
}
const stat=(n,l)=>`<div><b>${n??0}</b><span>${l}</span></div>`;
function fill(id,vals){const s=document.getElementById(id);vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o);});}

// ── derive: live status + live verdict (honest: JS re-checks policy; crypto is core-verified) ──────────────────────
function liveStatus(r){ return r.localRevoked ? "revoked" : "valid"; }

// The verification trace. Each step is either RE-CHECKED live in JS (policy invariants) or CORE-VERIFIED (the heavy
// crypto: hybrid signatures, SLH-DSA checkpoint, RFC 6962 Merkle) whose result we take from the shipped verdict.
function trace(r){
  const now = S.now, steps=[];
  const ok=(lbl,detail,src)=>steps.push({s:"ok",lbl,detail,src});
  const bad=(lbl,detail,src)=>steps.push({s:"bad",lbl,detail,src});

  // 1. schema — required fields present, subject well-formed
  const schemaOk = r.sub && r.iss && r.capabilities && r.keys!==null && r.tier && r.auth_class;
  schemaOk ? ok("Schema","required fields present, vct = ainra/passport/v1","js")
           : bad("Schema","missing a MUST field","js");
  // 2. registrar accredited
  const acc = S.records.some(x=>x.registrar===r.registrar) ;
  acc ? ok("Registrar accredited",`${r.registrar} in the signed directory`,"js")
      : bad("Registrar accredited","issuer not known","js");
  // 3. validity window
  let windowOk=true;
  if(now < r.nbf){ bad("Validity window",`not yet valid — nbf ${r.nbf} > now ${now}`,"js"); windowOk=false; }
  else if(now >= r.exp){ bad("Validity window",`expired — exp ${r.exp} ≤ now ${now}`,"js"); windowOk=false; }
  else ok("Validity window",`nbf ${r.nbf} ≤ now ${now} < exp ${r.exp}`,"js");
  // 4. hybrid signature — CORE verified
  const cryptoOk = r.shipped.verdict==="valid" || !["sig_invalid","alg_downgrade"].includes(r.shipped.reason);
  cryptoOk ? ok("Hybrid signature","Ed25519 + ML-DSA-65 both verified","core")
           : bad("Hybrid signature",REASONS[r.shipped.reason]||"","core");
  // 5. scope ceiling — caps ⊆ ceiling
  const overreach=(r.capabilities||[]).filter(c=>!(r.scope_ceiling||[]).includes(c));
  overreach.length? bad("Scope ceiling",`capability outside ceiling: ${overreach.join(", ")}`,"js")
                  : ok("Scope ceiling",`${(r.capabilities||[]).length} capability(ies) ⊆ ceiling`,"js");
  // 6. delegation chain — each hop narrows (granted ⊆ prior)
  if(r.hopN){
    let narrow=true, prev=null;
    for(const h of r.hops){ if(prev && !h.granted.every(g=>prev.includes(g))) narrow=false; prev=h.granted; }
    narrow ? ok("Delegation chain",`${r.hopN} hop(s), dual-signed, each ⊆ parent`,"js")
           : bad("Delegation chain","a hop widened its parent's authority","js");
  }
  // 7. status — live (respects the revoke workflow)
  liveStatus(r)==="revoked" ? bad("Revocation status","bit set in the signed status list","core")
                            : ok("Revocation status","not revoked (status bit clear)","core");
  // 8. log inclusion — CORE verified
  const loggedOk = r.shipped.verdict==="valid" || !["not_logged","checkpoint_invalid"].includes(r.shipped.reason);
  loggedOk ? ok("Logged-before-valid",`leaf ${r.leaf_index} included under checkpoint (RFC 6962)`,"core")
           : bad("Logged-before-valid",REASONS[r.shipped.reason]||"","core");
  return steps;
}
// The live verdict = first failing step's reason, else valid. Mirrors the core's fixed order.
function liveVerdict(r){
  const st=trace(r);
  const fail=st.find(s=>s.s==="bad");
  if(!fail) return {verdict:"valid"};
  const map={"Validity window":now=>S.now<r.nbf?"not_yet_valid":"expired","Hybrid signature":()=>r.shipped.reason||"sig_invalid",
    "Scope ceiling":()=>"ceiling_exceeded","Delegation chain":()=>"chain_widening","Revocation status":()=>"revoked",
    "Logged-before-valid":()=>r.shipped.reason||"not_logged","Schema":()=>"schema_violation","Registrar accredited":()=>"unknown_registrar"};
  const reason = map[fail.lbl] ? map[fail.lbl]() : (r.shipped.reason||"schema_violation");
  return {verdict:"invalid",reason};
}

// ── render ──────────────────────────────────────────────────────────────────────────────────────────────────────
function filtered(){
  let list=S.records.slice();
  if(S.fRegistrar) list=list.filter(r=>r.registrar===S.fRegistrar);
  if(S.fTier) list=list.filter(r=>r.tier===S.fTier);
  if(S.fAuth) list=list.filter(r=>r.auth_class===S.fAuth);
  if(S.valid) list=list.filter(r=>liveVerdict(r).verdict==="valid");
  if(S.revoked) list=list.filter(r=>liveStatus(r)==="revoked");
  if(S.delegated) list=list.filter(r=>r.hopN>0);
  if(S.q){
    const q=S.q.toLowerCase();
    list=list.filter(r=>[r.sub,r.operator,r.lineage,r.tier,r.registrar,...(r.capabilities||[])].join(" ").toLowerCase().includes(q));
  }
  const k=S.sort.key, d=S.sort.dir;
  const val=r=>({sub:r.sub,registrar:r.registrar,tier:r.tier,auth:r.auth_class,hops:r.hopN,
    status:liveStatus(r),verdict:liveVerdict(r).verdict}[k]);
  list.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*d;});
  return list;
}

function render(){
  syncControls();
  const list=filtered();
  document.getElementById("listMeta").textContent =
    `${list.length} of ${S.records.length} credential(s) · verifying at ${fmtTime(S.now)} · sorted by ${S.sort.key} ${S.sort.dir>0?"▲":"▼"}`;
  // header sort indicators
  document.querySelectorAll("#head th").forEach(th=>{
    const on=th.dataset.key===S.sort.key;
    th.setAttribute("aria-sort", on?(S.sort.dir>0?"ascending":"descending"):"none");
    th.querySelector(".ar").textContent = on?(S.sort.dir>0?"▲":"▼"):"↕";
  });
  const rows=document.getElementById("rows");
  rows.innerHTML = list.map(r=>{
    const v=liveVerdict(r), st=liveStatus(r);
    return `<tr data-sub="${esc(r.sub)}" aria-selected="${S.selected===r.sub}">
      <td class="sub"><span class="op">${esc(r.operator)}:</span>${esc(r.lineage)}<span class="op">@${esc(r.version)}</span></td>
      <td class="mono" style="font-size:11.5px">${esc(r.registrar)}</td>
      <td><span class="tier">${esc(r.tier)}</span></td>
      <td class="mono" style="font-size:11.5px">${esc(r.auth_class)}</td>
      <td><span class="hops ${r.hopN?'':'zero'}">${r.hopN?('▸ '+r.hopN):'—'}</span></td>
      <td><span class="badge ${st==='revoked'?'bad':'ok'} dot">${st}</span></td>
      <td><span class="badge ${v.verdict==='valid'?'ok':'bad'}">${v.verdict==='valid'?'VALID':'INVALID · '+v.reason}</span></td>
    </tr>`;
  }).join("");
  document.getElementById("empty").style.display = list.length?"none":"block";
  rows.querySelectorAll("tr").forEach(tr=>tr.onclick=()=>select(tr.dataset.sub));
  writeHash();
}

function select(sub){ S.selected = (S.selected===sub? null : sub); render(); renderDetail(); }

function renderDetail(){
  const d=document.getElementById("detail"), inner=document.getElementById("detailInner");
  const r=S.records.find(x=>x.sub===S.selected);
  if(!r){ d.classList.remove("open"); inner.innerHTML=""; return; }
  d.classList.add("open");
  const v=liveVerdict(r), st=trace(r);
  const chain = r.hopN ? `<div class="sec"><h3>Delegation chain · ${r.hopN} hop(s), dual-signed</h3><div class="chain">${
    r.hops.map((h,i)=>`<div class="hop"><div class="node"></div><div class="hc">
      <div class="who">${esc(i===0?h.from:'')||''}</div>
      <div class="who">${esc(i===0?'↓ '+h.to:'↓ '+h.to)}</div>
      <div class="grant">grants: ${h.granted.map(esc).join(", ")}</div></div></div>`).join("")
  }</div></div>` : "";
  inner.innerHTML = `
    <div class="dh"><h2>${esc(r.sub)}</h2><button class="x" onclick="select(null)" title="Close (Esc)">×</button></div>
    <div class="verdict-banner ${v.verdict==='valid'?'ok':'bad'}">
      <span class="big">${v.verdict==='valid'?'VALID':'INVALID'}</span>
      <span>${v.verdict==='valid'?'all steps pass at '+fmtTime(S.now):esc(REASONS[v.reason]||v.reason)}</span>
    </div>
    <div class="sec"><h3>Identity</h3><dl class="kv">
      <dt>issuer</dt><dd>${esc(r.iss)}</dd>
      <dt>registrar</dt><dd>${esc(r.registrar)}</dd>
      <dt>operator</dt><dd>${esc(r.operator)}</dd>
      <dt>tier</dt><dd>${esc(r.tier)}</dd>
      <dt>authority</dt><dd>class ${esc(r.auth_class)}</dd>
      <dt>valid</dt><dd>${fmtTime(r.nbf)} → ${fmtTime(r.exp)}</dd>
      <dt>status idx</dt><dd>${r.status_idx} @ ${esc(r.status_uri)}</dd>
    </dl></div>
    <div class="sec"><h3>Capabilities</h3><div class="caps">
      ${(r.capabilities||[]).map(c=>`<span class="cap">${esc(c)}</span>`).join("")}
      ${(r.scope_ceiling||[]).filter(c=>!(r.capabilities||[]).includes(c)).map(c=>`<span class="cap ceil">${esc(c)} (ceiling)</span>`).join("")}
    </div></div>
    ${chain}
    <div class="sec"><h3>Transparency-log anchor</h3><dl class="kv">
      <dt>log</dt><dd>${esc(r.log_origin)}</dd>
      <dt>leaf index</dt><dd>${r.leaf_index}</dd>
      <dt>checkpoint</dt><dd>size ${r.checkpoint_size}</dd>
      <dt>root</dt><dd>${esc(r.checkpoint_root)}</dd>
    </dl></div>
    <div class="sec"><h3>Verification trace <span style="text-transform:none;color:var(--cool)">(the 9-step order)</span></h3>
      <div class="trace">${st.map(s=>`<div class="step">
        <span class="ic ${s.s}">${s.s==='ok'?'✓':'✕'}</span>
        <span class="lbl"><b>${s.lbl}</b><small>${esc(s.detail)}</small></span>
        <span class="src ${s.src==='core'?'core':''}">${s.src==='core'?'core-verified':'re-checked'}</span>
      </div>`).join("")}</div>
      <div class="note"><b>re-checked</b> = this browser re-ran the policy invariant live · <b>core-verified</b> = the
      cryptographic step (hybrid signatures, SLH-DSA checkpoint, RFC 6962 Merkle) was verified by the AINRA Rust core;
      its result is carried in the signed export.</div>
    </div>
    <div class="sec"><h3>Actions</h3>
      <div class="actions">
        ${liveStatus(r)==='valid'
          ? `<button class="btn danger" onclick="doRevoke('${esc(r.sub)}')">Revoke this credential</button>`
          : `<span class="badge bad dot">already revoked</span>`}
        <button class="btn" onclick="reVerify('${esc(r.sub)}')">Re-verify</button>
      </div>
      <div class="actions" style="margin-top:10px">
        <span class="nowctl">verify at <input id="nowInput" type="text" value="${S.now}"> unix</span>
        <button class="btn" onclick="applyNow()">apply</button>
        <button class="btn" onclick="resetNow()">reset</button>
      </div>
      <div class="note">Revoke uses the live registrar-box daemon when a URL is set (top-right); otherwise it runs the
      workflow over loaded state and shows the delta that would be emitted. Re-verify re-runs the trace at the chosen time.</div>
    </div>`;
}

// ── revoke workflow (live daemon OR simulated over state) ───────────────────────────────────────────────────────
async function doRevoke(sub){
  const r=S.records.find(x=>x.sub===sub); if(!r) return;
  if(S.daemon && S.daemonOk){
    try{
      const res=await fetch(S.daemon.replace(/\/$/,"")+"/revoke",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({sub,now:S.now})});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const delta=await res.json();
      r.localRevoked=true; r.shipped={verdict:"invalid",reason:"revoked"};
      toast(`live revoke ✓ — delta seq ${delta.from_seq} → ${delta.seq} (delegate-countersigned)`);
    }catch(e){ toast("daemon revoke failed: "+e.message); return; }
  }else{
    r.localRevoked=true;
    toast(`revoked (workflow) — would emit signed delta seq ${r.statusSeq} → ${r.statusSeq+1}`);
    r.statusSeq++;
  }
  render(); renderDetail();
}
function reVerify(sub){ toast("re-verified at "+fmtTime(S.now)); renderDetail(); }
function applyNow(){ const v=parseInt(document.getElementById("nowInput").value,10); if(!isNaN(v)){S.now=v;render();renderDetail();} }
function resetNow(){ S.now=S.window?S.window.verified_at:0; render(); renderDetail(); }

// ── controls / hash / daemon ────────────────────────────────────────────────────────────────────────────────────
function syncControls(){
  set("q",S.q); set("fRegistrar",S.fRegistrar); set("fTier",S.fTier); set("fAuth",S.fAuth);
  press("cValid",S.valid); press("cRevoked",S.revoked); press("cDelegated",S.delegated);
}
const set=(id,v)=>{const e=document.getElementById(id); if(e&&e.value!==v) e.value=v;};
const press=(id,on)=>document.getElementById(id).setAttribute("aria-pressed",on);

function bind(){
  document.getElementById("q").addEventListener("input",e=>{S.q=e.target.value;render();});
  ["fRegistrar","fTier","fAuth"].forEach(id=>document.getElementById(id).addEventListener("change",e=>{S[id]=e.target.value;render();}));
  document.getElementById("cValid").onclick=()=>{S.valid=!S.valid; if(S.valid)S.revoked=false; render();};
  document.getElementById("cRevoked").onclick=()=>{S.revoked=!S.revoked; if(S.revoked)S.valid=false; render();};
  document.getElementById("cDelegated").onclick=()=>{S.delegated=!S.delegated; render();};
  const du=document.getElementById("daemonUrl");
  du.addEventListener("change",()=>{S.daemon=du.value.trim(); pingDaemon();});
  document.addEventListener("keydown",e=>{
    if(e.key==="/" && document.activeElement.id!=="q"){e.preventDefault();document.getElementById("q").focus();}
    if(e.key==="Escape"){ if(S.selected){select(null);} else {document.getElementById("q").blur();} }
  });
}
async function pingDaemon(){
  const dot=document.getElementById("daemonLive");
  if(!S.daemon){ dot.classList.remove("on"); S.daemonOk=false; return; }
  try{ const r=await fetch(S.daemon.replace(/\/$/,"")+"/accreditation",{cache:"no-store"}); S.daemonOk=r.ok; }
  catch(e){ S.daemonOk=false; }
  dot.classList.toggle("on",S.daemonOk);
  toast(S.daemonOk?"connected to live registrar-box":"daemon unreachable — using workflow simulation");
}

function writeHash(){
  const p=new URLSearchParams();
  if(S.q)p.set("q",S.q); if(S.fRegistrar)p.set("reg",S.fRegistrar); if(S.fTier)p.set("tier",S.fTier);
  if(S.fAuth)p.set("auth",S.fAuth); if(S.valid)p.set("valid","1"); if(S.revoked)p.set("revoked","1");
  if(S.delegated)p.set("del","1"); if(S.sort.key!=="sub"||S.sort.dir!==1)p.set("sort",S.sort.key+(S.sort.dir<0?":d":""));
  if(S.selected)p.set("sel",S.selected);
  const h=p.toString(); history.replaceState(null,"", h?("#"+h):location.pathname);
}
function restoreFromHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  S.q=p.get("q")||""; S.fRegistrar=p.get("reg")||""; S.fTier=p.get("tier")||""; S.fAuth=p.get("auth")||"";
  S.valid=p.get("valid")==="1"; S.revoked=p.get("revoked")==="1"; S.delegated=p.get("del")==="1";
  if(p.get("sort")){const[k,dd]=p.get("sort").split(":");S.sort={key:k,dir:dd==="d"?-1:1};}
  S.selected=p.get("sel")||null;
  if(S.selected) setTimeout(renderDetail,0);
}

// ── util ────────────────────────────────────────────────────────────────────────────────────────────────────────
let toastT;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}
function fmtTime(u){ if(!u) return "—"; const d=new Date(u*1000); return d.toISOString().slice(0,10)+" "+d.toISOString().slice(11,16)+"Z"; }

bind(); load();
</script>
