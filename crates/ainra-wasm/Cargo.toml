# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "ainra-wasm"
description = "The verify path compiled to WebAssembly. A THIN binding over ainra-adapter — it parses nothing of its own, calls nothing, and reads no clock. If this crate ever needs to convert something itself, that is a design fault to report, not code to write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ainra-core = { path = "../ainra-core" }
ainra-adapter = { path = "../ainra-adapter" }
serde_json = { workspace = true, features = ["std"] }
wasm-bindgen = "=0.2.126"   # MUST match the wasm-bindgen-cli version exactly

[features]
# The edge gate's bindings (PLAN-M34 Task 5): request signatures, directory accreditation, the gate itself. Off in
# the browser build, so a page downloads only what verifying a bundle needs (tools/build-wasm.sh keeps its ceiling);
# on in the edge build (tools/build-wasm-edge.sh), which a gate loads once per isolate.
edge = []
