# AINRA STAGING network — one host. `docker compose -f deploy/compose.staging.yml up` brings the whole network up.
# STAGING on a TEST-ROOT: real infrastructure, real crypto, honest labels. No trust migrates to the future
# production root (born only at the recorded genesis ceremony — a pending DoD row). The 3-host regional split is in
# deploy/README.md. Secrets: the write token comes from the environment / an .env file, NEVER baked into an image.
name: ainra-staging
services:
  registrar-07:
    build: { context: .., dockerfile: deploy/Dockerfile.services }
    image: ainra/services:staging
    command: ["0.0.0.0:4907", "registrar-07", "/data"]
    environment:
      AINRA_STAGE: "1"
      AINRA_STAGE_ISSUE_TOKEN: "${AINRA_STAGE_ISSUE_TOKEN:?set a staging issue token in deploy/.env}"
    volumes: ["reg07:/data"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4907/health"], interval: 15s, retries: 5 }
    ports: ["4907:4907"]
    read_only: true
    tmpfs: ["/tmp"]

  registrar-11:                       # a DISTINCT registrar class (distinct keys) — mirrors the accreditation story
    image: ainra/services:staging
    command: ["0.0.0.0:4911", "registrar-11", "/data"]
    environment:
      AINRA_STAGE: "1"
      AINRA_STAGE_ISSUE_TOKEN: "${AINRA_STAGE_ISSUE_TOKEN:?set a staging issue token in deploy/.env}"
    volumes: ["reg11:/data"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4911/health"], interval: 15s, retries: 5 }
    ports: ["4911:4911"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: [registrar-07]

  witness:                            # an independent witness; more join from other hosts (witness-quickstart.md)
    image: ainra/services:staging
    entrypoint: ["witnessd"]
    command: ["0.0.0.0:4891", "/data"]
    volumes: ["witness:/data"]
    ports: ["4891:4891"]
    read_only: true
    tmpfs: ["/tmp"]

  artifacts:                          # the public CDN-shaped read surface (front this with a real CDN in production)
    build: { context: .., dockerfile: deploy/Dockerfile.artifacts }
    image: ainra/artifacts:staging
    environment: { AINRA_STAGE: "1" }
    volumes: ["public:/public:ro"]    # populated by the publisher step (tools/stage.sh publish / a cron job)
    ports: ["8091:8091"]
    read_only: true

volumes: { reg07: {}, reg11: {}, witness: {}, public: {} }
