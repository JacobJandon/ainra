<!doctype html>
<meta charset="utf-8">
<title>Verify an agent credential — in your browser</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{color-scheme:light dark}
  body{font:15px/1.6 system-ui,sans-serif;max-width:820px;margin:40px auto;padding:0 20px}
  h1{font-size:1.5rem;margin:0 0 6px}
  p.lede{color:#5A6372;margin:0 0 20px}
  textarea{width:100%;min-height:140px;font:12px/1.5 ui-monospace,monospace;padding:10px;border:1px solid #ccc;border-radius:8px}
  button{font:600 14px system-ui;padding:10px 18px;border:0;border-radius:99px;background:#1A6B4E;color:#fff;cursor:pointer;margin-top:10px}
  button:active{transform:scale(.98)}
  pre{background:#0A101E;color:#B9F4D8;padding:14px;border-radius:8px;overflow:auto;font-size:12px}
  .ok{color:#1A6B4E;font-weight:700}.no{color:#8a6a14;font-weight:700}
</style>
<h1>Verify an agent credential — in your browser</h1>
<p class="lede">
  This runs the real AINRA verifier client-side. There is no server, no account, and nothing is uploaded — the
  page fetches nothing at verification time. Edit the bundle and watch it refuse.
</p>

<textarea id="in" spellcheck="false"></textarea>
<button id="go" type="button">Verify →</button>
<p id="out"></p>
<pre id="ev" hidden></pre>

<script type="module">
  // The npm dist/ is the Node build (it imports node:zlib). The browser build is what runs in a page — the same
  // source, bundled for the platform, and the same file the project's own site serves.
  import { runVector, expectedVerdict } from "./ainra-sdk.js";

  // A real conformance vector, shipped with the corpus. Its recorded verdict is the answer the other three
  // independent implementations produce for the same bytes.
  const vector = await (await fetch("./vector.json")).json();
  const $ = (id) => document.getElementById(id);
  $("in").value = JSON.stringify(vector, null, 2);

  $("go").addEventListener("click", () => {
    let v;
    try { v = JSON.parse($("in").value); }
    catch { $("out").innerHTML = '<span class="no">INVALID</span> — that is not readable JSON'; return; }
    let got;
    try { got = runVector(v); }
    catch (e) { $("out").innerHTML = `<span class="no">INVALID</span> — ${e.message}`; return; }
    const ok = got.verdict === "valid";
    const want = (() => { try { return expectedVerdict(v); } catch { return null; } })();
    $("out").innerHTML =
      `<span class="${ok ? "ok" : "no"}">${ok ? "VALID" : "INVALID · " + (got.reason || "")}</span>` +
      (want ? ` — the corpus records <code>${JSON.stringify(want)}</code>` : "");
    $("ev").hidden = false;
    $("ev").textContent = JSON.stringify(got, null, 2);
  });
</script>
